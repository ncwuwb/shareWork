server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shared_workspace?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

share:
  jwt:
    secret: ${SHARE_JWT_SECRET:change-this-jwt-secret-in-env}
    app-expire-days: 7
    admin-expire-hours: 12
  upload:
    dir: ${user.dir}/uploads
  cors:
    allowed-origins: ${SHARE_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  bootstrap:
    admin:
      enabled: ${SHARE_BOOTSTRAP_ADMIN_ENABLED:false}
      phone: ${SHARE_BOOTSTRAP_ADMIN_PHONE:}
      password: ${SHARE_BOOTSTRAP_ADMIN_PASSWORD:}
      real-name: ${SHARE_BOOTSTRAP_ADMIN_NAME:Super Admin}
  captcha:
    debug-log-code: ${SHARE_CAPTCHA_DEBUG_LOG_CODE:true}

logging:
  level:
    com.jy.sharework: INFO
